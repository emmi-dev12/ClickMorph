name: Release

# Trigger: push a tag like v0.1.0 → build DMG on macOS → publish GitHub release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write   # needed to create the GitHub release

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: |
          # Strip leading "v": v0.1.0 → 0.1.0
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and package DMG
        run: make dmg VERSION=${{ steps.ver.outputs.VERSION }}

      - name: Create GitHub release and upload DMG
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ClickMorph-${{ steps.ver.outputs.VERSION }}.dmg" \
            --title "ClickMorph $GITHUB_REF_NAME" \
            --notes $'Drag **ClickMorph.app** to */Applications* to install.\n\n> Requires macOS 13 Ventura or later.\n> Grant Accessibility permission on first launch (System Settings → Privacy & Security → Accessibility).'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
